<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Cadastro de Paciente</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">
                <img src="/imagens/logo1.png" alt="Logo Comp" width="75" height="75">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="/geral/index.html">Home</a>
                    <a class="nav-link" href="/geral/galeria.html">Galerias</a>
                    <a class="nav-link" href="/geral/agendamentos.html">Agendamentos</a>
                </div>
                
                <div class="navbar-nav">
                    <a id="login-link" class="nav-link" href="/geral/login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="container mt-5">
        <div class="card justify-content-center">
            <div class="card-body">
                <form class="row g-4">
                    <h2>Faça seu cadastro</h2>
                    <div class="col-md-6">
                        <label for="inputName" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="inputName" placeholder="Digite seu nome" required>
                    </div>

                    <div class="col-md-3">
                        <label for="inputCPF" class="form-label">CPF</label>
                        <input type="text" class="form-control" id="inputCPF" placeholder="Digite seu CPF" required>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Sexo</label>
                        <div class="d-flex gap-3">
                            <div>
                                <input type="radio" id="inputSexoMasculino" name="inputSexo" value="masculino" required>
                                <label for="inputSexoMasculino">Masculino</label>
                            </div>
                            <div>
                                <input type="radio" id="inputSexoFeminino" name="inputSexo" value="feminino" required>
                                <label for="inputSexoFeminino">Feminino</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="inputEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com"
                            required>
                    </div>

                    <div class="col-md-3">
                        <label for="inputDataNascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control" id="inputDataNascimento" required>
                    </div>

                    <div class="col-md-3">
                        <label for="inputTelefone" class="form-label">Telefone</label>
                        <input type="tel" class="form-control" id="inputTelefone" placeholder="(XX) XXXXX-XXXX"
                            required>
                    </div>

                    <div class="col-md-2">
                        <label for="inputCep" class="form-label">CEP</label>
                        <input type="text" class="form-control" id="inputCep" placeholder="Digite seu CEP" required>
                    </div>

                    <div class="col-md-6">
                        <label for="inputEndereco" class="form-label">Endereço</label>
                        <input type="text" class="form-control" id="inputEndereco" placeholder="Digite seu endereço"
                            required>
                    </div>

                    <div class="col-md-2">
                        <label for="inputNumero" class="form-label">Número</label>
                        <input type="text" class="form-control" id="inputNumero" placeholder="Digite o número" required>
                    </div>

                    <div class="col-md-2">
                        <label for="inputComplemento" class="form-label">Complemento</label>
                        <input type="text" class="form-control" id="inputComplemento"
                            placeholder="Digite o complemento">
                    </div>

                    <div class="col-md-3">
                        <label for="inputBairro" class="form-label">Bairro</label>
                        <input type="text" class="form-control" id="inputBairro" placeholder="Digite o bairro" required>
                    </div>

                    <div class="col-md-3">
                        <label for="inputCidade" class="form-label">Cidade</label>
                        <input type="text" class="form-control" id="inputCidade" placeholder="Digite a cidade" required>
                    </div>

                    <div class="col-md-3">
                        <label for="inputEstado" class="form-label">Estado</label>
                        <input type="text" class="form-control" id="inputEstado" placeholder="Digite o estado" required>
                    </div>

                    <div class="col-md-3">
                        <label for="inputBloodType" class="form-label">Tipo Sanguíneo</label>
                        <select id="inputBloodType" class="form-select" required>
                            <option value="0">Escolha...</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="inputPassword" class="form-label">Crie sua senha</label>
                        <input type="password" class="form-control" id="inputPassword" required>
                    </div>

                    <div class="col-12 justify-content-center d-flex">
                        <button type="submit" class="btn btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
    </section>

    <footer>
        <div class="container">
            <div class="row">
                <div class="col text-center">
                    <p>&copy; 2024 Clínica Médica. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>    
</body>

</html>
