<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Login - Clínica Médica</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">COMP</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="#">Galerias</a>
                    <a class="nav-link" href="agendamentos.html">Agendamentos</a>
                    <a class="nav-link active" aria-current="page" href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Acesso ao Sistema</h2>

                        <!-- Tabs para escolher tipo de usuário -->
                        <ul class="nav nav-tabs mb-4" id="userTypeTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="paciente-tab" data-bs-toggle="tab"
                                    data-bs-target="#paciente-pane" type="button" role="tab"
                                    aria-controls="paciente-pane" aria-selected="true">Paciente</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="funcionario-tab" data-bs-toggle="tab"
                                    data-bs-target="#funcionario-pane" type="button" role="tab"
                                    aria-controls="funcionario-pane" aria-selected="false">Funcionário</button>
                            </li>
                        </ul>

                        <div class="tab-content" id="userTypeContent">
                            <!-- Login Paciente -->
                            <div class="tab-pane fade show active" id="paciente-pane" role="tabpanel"
                                aria-labelledby="paciente-tab">
                                <form id="loginPacienteForm">
                                    <div class="mb-3">
                                        <label for="emailPaciente" class="form-label">Email</label>
                                        <input type="email" class="form-control" id="emailPaciente" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="passwordPaciente" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="passwordPaciente" required>
                                    </div>
                                    <div class="d-grid gap-2">
                                        <button type="submit" class="btn btn-primary">Entrar</button>
                                        <a href="cadastro-paciente.html" class="btn btn-outline-secondary">
                                            Criar Conta de Paciente
                                        </a>
                                    </div>
                                </form>
                            </div>

                            <!-- Login Funcionário -->
                            <div class="tab-pane fade" id="funcionario-pane" role="tabpanel"
                                aria-labelledby="funcionario-tab">
                                <form id="loginFuncionarioForm">
                                    <div class="mb-3">
                                        <label for="emailFuncionario" class="form-label">Email Corporativo</label>
                                        <input type="email" class="form-control" id="emailFuncionario" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="passwordFuncionario" class="form-label">Senha</label>
                                        <input type="password" class="form-control" id="passwordFuncionario" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="codigoAcesso" class="form-label">Código de Acesso</label>
                                        <input type="text" class="form-control" id="codigoAcesso"
                                            placeholder="Código fornecido pela administração" required>
                                    </div>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-success">Entrar como Funcionário</button>
                                    </div>
                                </form>

                                <div class="alert alert-info mt-3" role="alert">
                                    <small>
                                        <strong>Funcionários:</strong> Use suas credenciais corporativas e o código de
                                        acesso
                                        fornecido pela administração.
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-5">
        <div class="container">
            <div class="row">
                <div class="col text-center">
                    <p>&copy; 2024 Clínica Médica. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>


    <script>
        // Script simples para alternar entre tabs de login
        document.addEventListener('DOMContentLoaded', function () {

            // Seleciona os botões das tabs
            const tabPaciente = document.getElementById('paciente-tab');
            const tabFuncionario = document.getElementById('funcionario-tab');

            // Seleciona os painéis de conteúdo
            const painelPaciente = document.getElementById('paciente-pane');
            const painelFuncionario = document.getElementById('funcionario-pane');

            // Função para ativar tab do paciente
            function ativarTabPaciente() {
                // Remove classes ativas do funcionário
                tabFuncionario.classList.remove('active');
                painelFuncionario.classList.remove('show', 'active');

                // Adiciona classes ativas ao paciente
                tabPaciente.classList.add('active');
                painelPaciente.classList.add('show', 'active');

                // Atualiza atributos ARIA
                tabPaciente.setAttribute('aria-selected', 'true');
                tabFuncionario.setAttribute('aria-selected', 'false');
            }

            // Função para ativar tab do funcionário
            function ativarTabFuncionario() {
                // Remove classes ativas do paciente
                tabPaciente.classList.remove('active');
                painelPaciente.classList.remove('show', 'active');

                // Adiciona classes ativas ao funcionário
                tabFuncionario.classList.add('active');
                painelFuncionario.classList.add('show', 'active');

                // Atualiza atributos ARIA
                tabFuncionario.setAttribute('aria-selected', 'true');
                tabPaciente.setAttribute('aria-selected', 'false');
            }

            // Event listeners para os cliques
            tabPaciente.addEventListener('click', function (e) {
                e.preventDefault();
                ativarTabPaciente();
            });

            tabFuncionario.addEventListener('click', function (e) {
                e.preventDefault();
                ativarTabFuncionario();
            });

            // Define o estado inicial (paciente ativo)
            ativarTabPaciente();
        });
    </script>
</body>

</html>
