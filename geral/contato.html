<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">
                <img src="/imagens/logo1.png" alt="Logo Comp" width="75" height="75">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="galeria.html">Galerias</a>
                    <a class="nav-link" href="agendamentos.html">Agendamentos</a>
                </div>
                
                <div class="navbar-nav">
                    <a id="login-link" class="nav-link" href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>
   

    <main class="container my-5">
        <section class="card shadow p-4">
            <h2 class="text-center mb-4">Entre em Contato</h2>
            <form action="../backEnd/backEndGeral/salvarContato.php" method="post">
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome:</label>
                    <input type="text" class="form-control" id="nome" name="nome" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input type="tel" class="form-control" id="telefone" name="telefone" placeholder="(xx) xxxxx-xxxx">
                </div>

                <div class="mb-3">
                    <label for="mensagem" class="form-label">Mensagem:</label>
                    <textarea class="form-control" id="mensagem" name="mensagem" rows="5" required></textarea>
                </div>

                <div class="mb-3">
                    <label for="datahora" class="form-label">Data e Hora:</label>
                    <input type="datetime-local" class="form-control" id="datahora" name="datahora" required>
                </div>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary px-4">Enviar</button>
                </div>
            </form>
        </section>
    </main>

    <footer class="bg-light text-center py-3">
        <p class="mb-0">&copy; 2025 Clínica Médica - Saúde e Bem-Estar</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
