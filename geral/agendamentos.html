<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Agendamentos</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">
                <img src="/imagens/logo1.png" alt="Logo Comp" width="75" height="75">
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav me-auto">
                    <a class="nav-link" href="index.html">Home</a>
                    <a class="nav-link" href="galeria.html">Galerias</a>
                    <a class="nav-link" href="agendamentos.html">Agendamentos</a>
                </div>
                
                <div class="navbar-nav">
                    <a id="login-link" class="nav-link" href="login.html">Login</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="container mt-5">
        <div class="card justify-content-center">
            <div class="card-body">
                <form class="row g-4">
                    <h2>Faça seu agendamento</h2>
                    <div class="col-md-6">
                        <label for="inputName" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="inputName" placeholder="Digite seu nome" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Sexo</label>
                        <div class="d-flex gap-3">
                            <div>
                                <input type="radio" id="inputSexoMasculino" name="inputSexo" value="masculino" required>
                                <label for="inputSexoMasculino">Masculino</label>
                            </div>
                            <div>
                                <input type="radio" id="inputSexoFeminino" name="inputSexo" value="feminino" required>
                                <label for="inputSexoFeminino">Feminino</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="inputEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="inputEmail" placeholder="name@example.com"
                            required>
                    </div>
                    <div class="col-md-3">
                        <label for="inputDate" class="form-label">Data</label>
                        <input type="date" class="form-control" id="inputDate" required>
                    </div>
                    <div class="col-md-3">
                        <label for="inputTime" class="form-label">Horário</label>
                        <select id="inputTime" class="form-select">
                            <option value="0">Escolha...</option>
                            <option value="8">08:00</option>
                            <option value="9">09:00</option>
                            <option value="10">10:00</option>
                            <option value="11">11:00</option>
                            <option value="12">12:00</option>
                            <option value="13">13:00</option>
                            <option value="14">14:00</option>
                            <option value="15">15:00</option>
                            <option value="16">16:00</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="inputEspecialidade" class="form-label">Especialidade</label>
                        <select id="inputEspecialidade" class="form-select">
                            <option value="0">Escolha...</option>
                            <option value="clinico_geral">Clínico Geral</option>
                            <option value="pediatra">Pediatra</option>
                            <option value="dermatologista">Dermatologista</option>
                        </select>
                    </div>

                    <div class="col-md-3">
                        <label for="inputDoctor" class="form-label">Médico</label>
                        <select id="inputDoctor" class="form-select" required>
                            <option value="0">Escolha...</option>
                            <option value="dr_silva">Dr. Silva</option>
                            <option value="dr_souza">Dr. Souza</option>
                            <option value="dr_mendes">Dr. Mendes</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="inputDescription" class="form-label">Descrição</label>
                        <textarea id="inputDescription" class="form-control" rows="3"
                            placeholder="Digite uma breve descrição do motivo da consulta" required></textarea>
                    </div>

                    <div class="col-12 justify-content-center d-flex">
                        <button type="submit" class="btn btn-primary">Agendar</button>
                    </div>
                </form>
            </div>
    </section>

    <footer>
        <div class="container">
            <div class="row">
                <div class="col text-center">
                    <p>&copy; 2024 Clínica Médica. Todos os direitos reservados.</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</body>

</html>
