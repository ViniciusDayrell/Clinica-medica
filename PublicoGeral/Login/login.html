    <main class="container mt-5">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Login</h2>

          <form id="cadastro" method="POST" action="realizarLogin.php" enctype="multipart/form-data">
              <fieldset>
                  <div class="mb-3">
                     <label for="email" class="form-label">E-mail:</label>
                      <input type="email" id="email" name="email" class="form-control">
                     <span></span>
                  </div>
                  <div class="mb-3">
                      <label for="senha" class="form-label">Senha:</label>
                      <input type="password" id="senha" name="senha" class="form-control">
                      <span></span>
                  </div>
                  
              </fieldset>

              <button id="botao" type="submit" class="btn btn-success">Entrar</button>
              <div id="msgErro" style="display: none;">
                  <span>E-mail e/ou senha incorreta. Por favor, tente novamente.</span>
              </div>

              <div class="alert alert-info mt-3" role="alert">
                <small>
                  <strong>Funcionários:</strong> Use suas credenciais corporativas e a senha criada pela administração.
                  </small>
              </div>

          </form>
        </div>
      </div>
    </main>

    <footer>
        <address>Avenida João Naves de Ávila 2121, Santa Mônica, Uberlândia</address>
    </footer>

     <script>
      // Cria um objeto XMLHttpRequest (XHR), usado para enviar o formulário via AJAX.
      // Pega a URL do action do formulário (realizarLogin.php) e configura a requisição como POST.
      // Define que a resposta esperada será JSON.

        function sendForm(form) {
          
          let xhr = new XMLHttpRequest();
          
          xhr.open("POST", form.getAttribute("action"));
          xhr.responseType = 'json';
          
          // Define o que fazer quando a resposta for recebida
          // Se o status for diferente de 200 ou a resposta for nula, exibe uma mensagem de erro no console.
          // Se o login for bem-sucedido (loginResponse.success é true), redireciona para a página indicada em loginResponse.detail.
          xhr.onload = function () {
            if (xhr.status != 200 || xhr.response === null) {
              console.log("A resposta não pode ser obtida ");
              console.log(xhr.status);
              return;
            }
    
            let loginResponse = xhr.response;
            if (loginResponse.success)
              window.location = loginResponse.detail;
            if(loginResponse.success == false){
              document.querySelector("#msgErro").style.display = 'block';
              form.senha.value = "";
              form.senha.focus();
            }
          }      
    
          xhr.onerror = function () {
            console.error("Erro de rede - requisição não finalizada");
          };
    
          xhr.send(new FormData(form));
        }
    
        window.onload = function () {
          const form = document.querySelector("#cadastro");
          form.onsubmit = function (e) {
            sendForm(form);
            e.preventDefault();
          }
        }
      </script> 

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
